# toml-language-server: $schema=https://www.schemastore.org/ruff.json

force-exclude     = true
indent-width      = 4
line-length       = 120
respect-gitignore = true
target-version    = "py313"
# unsafe-fixes      = true

exclude = [  ]

[format]
  docstring-code-format      = true
  docstring-code-line-length = "dynamic"
  indent-style               = "space"
  line-ending                = "lf"
  quote-style                = "single"
  skip-magic-trailing-comma  = false

[lint]
  fixable   = [ "ALL" ]
  select    = [ "ALL" ]
  unfixable = [  ]

  ignore = [
    # ID       # Name                              # Reason for Disabling
    # -------- # --------------------------------- # --------------------
    "ANN002",  # missing-type-args                 # ANN002-ANN003: unhelpful/annoying
    "ANN003",  # missing-type-kwargs               # -
    "ANN401",  # any-type                          # while not ideal, `Any` is often useful or necessary
    "BLE001",  # blind-except                      # `BaseException` fangen? Böse. `Exception`? Völlig in Ordnung...
    "COM812",  # missing-trailing-comma            # COM812-COM819: enforced by formatter
    "COM819",  # prohibited-trailing-comma         # -
    "CPY",     # missing-copyright-notice          # -
    "D1",      # pydocstyle                        # stylistic
    "D202",    # blank-line-after-function         # removes blank line between docstring and function body
    "D203",    # incorrect-blank-line-before-class # adds blank line between class definition and docstring
    "D206",    # docstring-tab-indentation         # D206-208: enforced by formatter
    "D207",    # under-indentation                 # -
    "D208",    # over-indentation                  # -
    "D213",    # multi-line-summary-second-line    # moves summary line to second physical line of docstring
    "ERA001",  # commented-out-code                # commented-out code is likely harmless and intentional
    "F401",    # unused-import                     # removes imports while working if saved and fix-on-save is enabled
    "FIX",     # flake8-fixme                      # useless nag about fixme/hack/todo/etc. comments
    "INP001",  # implicit-namespace-package        # useless nag about the lack of an `__init__.py`
    "N817",    # camelcase-imported-as-acronym     # N817-N818: stylistic
    "N818",    # error-suffix-on-exception-name    # -
    "PLC0414", # useless-import-alias              # intentional if present
    "PLC0415", # import-outside-top-level          # imports in functions are useful in multiple different scenarios
    "PLR2004", # magic-value-comparison            # useless nag
    "PLW0603", # global-statement                  # intentional if present
    "PTH",     # flake8-use-pathlib                # pathlib should be used with discretion due to performance overhead
    "PYI021",  # docstring-in-stub                 # senseless - consider C extensions which consist of only stubs
    "S1",      # flake8-bandit                     # various lints that should be obvious
    "S311",    # ...non-cryptographic-random-usage # intentional if present
    "S6",      # flake8-bandit                     # various lints that should be obvious
    "S701",    # jinja2-autoescape-false           # intentional if present
    "SIM102",  # collapsible-if                    # stylistic
    "SLF001",  # private-member-access             # useless nag
    "T20",     # flake8-print                      # doch
    "TD",      # missing-todo-{author,link,...}    # -
  ]

  [lint.per-file-ignores]
    "*.pyi"    = [ "D404" ] # docstring-starts-with-this
    "*compat*" = [ "UP" ]   # pyupgrade

    "__init__.py" = [
      # "F403", # undefined-local-with-import-star
      # "F405", # undefined-local-with-import-star-usage
      #         # no excuses - use this: https://github.com/asmeurer/removestar
    ]

    "*codemod*" = [
      # LibCST expects code to conform in a way which these rules forbid
      "ARG002", # unused-method-argument
      "N802",   # invalid-function-name
    ]

    "*test*" = [
      "ANN001", # missing-type-function-argument
      "ARG002", # unused-method-argument
      "D",      # pydocstyle
      "Q000",   # bad-quotes-inline-string
      "S101",   # assert
    ]

  [lint.flake8-unused-arguments]
    ignore-variadic-names = true

  [lint.flake8-annotations]
    allow-star-arg-any = true

  [lint.flake8-bugbear]
    extend-immutable-calls = [  ]

  [lint.flake8-quotes]
    inline-quotes = "single"

  [lint.isort]
    known-first-party = [  ]

  [lint.mccabe]
    max-complexity = 30

  [lint.pydocstyle]
    convention            = "numpy"
    ignore-var-parameters = true

  [lint.pylint]
    # allow-magic-value-types = [ "float", "int", "str" ]

    max-args            = 30
    max-bool-expr       = 30
    max-branches        = 30
    max-locals          = 30
    max-nested-blocks   = 10
    max-positional-args = 10
    max-returns         = 30
    max-statements      = 75
