version: '0.2'
language: en_US,de_DE
useGitignore: false
allowCompoundWords: true
ignoreRandomStrings: true

ignorePaths:
  - '**/__*cache__/'
  - '**/.*cache/'
  - '**/.devenv/'
  - '**/.editorconfig'
  - '**/.git/{index,*refs,*HEAD}'
  - '**/.git/{info,lfs,logs,refs,objects}/'
  - '**/.gitignore'
  - '**/.venv/'
  - '**/*-lock.*'
  - '**/*.lock'

ignoreRegExpList:
  - \b([\da-z]{26}|[\dA-Z]{26})\b
  - \b[A-Z]{2,5}\b
  - (\[[A-Za-z]{1,}\])([a-zA-Z]+)?\b
  - (\.[a-zA-Z]{1,6}((\.[a-zA-Z]{1,4})?)\b)
  - (ssh-(rsa|dss|ed25519|ecdsa-[a-z0-9]+))\s+([A-Za-z0-9+\/]+={0,2})
  - \b(asst|thread|msg|run|file)_([A-Za-z0-9]{24})\b

import:
  - https://cdn.jsdelivr.net/npm/@cspell/dict-de-de@4/cspell-ext.json
  - https://cdn.jsdelivr.net/npm/@cspell/dict-en_us@4/cspell-ext.json

dictionaryDefinitions:
  - name: Workspace Custom Wordlist
    addWords: true
    description: Workspace Custom Wordlist ('_meta/config/cspell.txt')
    path: _meta/config/cspell.txt

dictionaries:
  # Custom dictionaries
  - Workspace Custom Wordlist
  # Dictionaries provided by cspell
  - aws
  - bash
  - coding-compound-terms
  - companies
  - computing-acronyms
  - cpp
  - cryptocurrencies
  - css
  - data-science
  - data-science-models
  - data-science-tools
  - de_DE
  - en_US
  - en-common-misspellings
  - en-shared
  - en-us-common-misspellings
  - filetypes
  - fullstack
  - golang
  - html
  - html-symbol-entities
  - k8s
  - lorem-ipsum
  - lua
  - networking-terms
  - node
  - npm
  - public-licenses
  - python
  - python-common
  - shellscript
  - software-term-suggestions
  - software-tools
  - softwareTerms
  - sql
  - svelte
  - swift
  - terraform
  - typescript
  - web-services
